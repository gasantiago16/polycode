<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; margin-top: 50px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin: 20px auto; width: 320px; }
    .cell { width: 100px; height: 100px; font-size: 48px; display: flex; align-items: center; justify-content: center; background: #f0f0f0; border: 2px solid #333; cursor: pointer; }
    .cell:hover { background: #e0e0e0; }
    .status { font-size: 24px; margin: 20px; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="status" id="status">Player X's turn</div>
  <div class="board" id="board"></div>
  <button onclick="resetGame()">Reset</button>

  <script>
    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;

    const statusEl = document.getElementById('status');
    const boardEl = document.getElementById('board');

    function createBoard() {
      boardEl.innerHTML = '';
      board.forEach((_, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', handleClick);
        boardEl.appendChild(cell);
      });
    }

    function handleClick(e) {
      const i = parseInt(e.target.dataset.index);
      if (board[i] || gameOver) return;

      board[i] = currentPlayer;
      updateBoard();

      if (checkWin()) {
        statusEl.textContent = `${currentPlayer} wins!`;
        gameOver = true;
      } else if (board.every(cell => cell)) {
        statusEl.textContent = "It's a draw!";
        gameOver = true;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusEl.textContent = `Player ${currentPlayer}'s turn`;
      }
    }

    function updateBoard() {
      Array.from(boardEl.children).forEach((cell, i) => {
        cell.textContent = board[i] || '';
      });
    }

    function checkWin() {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return wins.some(([a,b,c]) => 
        board[a] && board[a] === board[b] && board[a] === board[c]
      );
    }

    function resetGame() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      statusEl.textContent = `Player ${currentPlayer}'s turn`;
      createBoard();
    }

    createBoard();
  </script>
</body>
</html>
